[project]
name = "universal-ai-cartoon-studio"
version = "0.1.0"
description = "Local-first, approval-gated cartoon production manager foundation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Direct application dependencies. Exact versions of these and all transitive
# downloads are recorded in uv.lock; restore with uv sync --frozen.
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.118,<1",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.43,<3",
  "starlette>=0.48,<2",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
# Test/lint tools, including the HTTP client used by the locked Starlette tests.
dev = [
  "httpx2>=2.16,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --disable-warnings --basetemp=storage/20_TEMP/pytest"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
